services:
  app:
    build:
      context: .
      target: development
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env.local}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env.local}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN:-hs.pbl.example}
      CRON_SECRET: ${CRON_SECRET:-}
      EXPORT_PSEUDONYM_SECRET: ${EXPORT_PSEUDONYM_SECRET:-}
      EXPORT_PSEUDONYM_KEY_VERSION: ${EXPORT_PSEUDONYM_KEY_VERSION:-1}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    init: true

volumes:
  node_modules:
  next_cache:
