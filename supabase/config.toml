# [DB] Cấu hình Supabase local · tài liệu mục 4.4 và 8.7
# Realtime cho tasks và group_messages được bật trong migration 0004_groups_tasks_logs.sql

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = false
enable_confirmations = false

[auth.email]
enable_signup = false
double_positive_confirmation = false
enable_confirmations = false

[auth.password]
minimum_length = 8
