# [DB] Cấu hình Supabase local · tài liệu mục 4.4 và 8.7
# Realtime cho tasks và group_messages được bật trong migration 0004_groups_tasks_logs.sql

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_confirmations = true

[auth.email]
enable_signup = true
double_positive_confirmation = false
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.template.confirmation]
subject = "Xác minh tài khoản EDUHT"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Mã khôi phục mật khẩu EDUHT"
content_path = "./supabase/templates/recovery.html"

[auth.password]
minimum_length = 8

[storage.vector]
enabled = false
